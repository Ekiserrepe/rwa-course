name: Verify examples on testnet

# Runs every script in /examples against Xahau testnet and checks each result
# against its lesson. Weekly, because the network, the xahau library and the
# public IPFS gateways all change without asking. Spends only faucet XAH.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: examples/verify/last-run.log
